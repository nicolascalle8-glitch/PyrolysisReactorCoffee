# Caso base del motor nuevo. Cada parámetro: valor, unidad, etiqueta, fuente, rango [min, max].
# Etiquetas: Dato | Medido | Norma | Supuesto | Calculado | Por validar (contrato de las IAs en Skill_Repository).
# Composición del lecho en % base seca: celulosa + hemicelulosa + lignina + lipidos + otros + cenizas = 100.
# Humedad en % base húmeda. Temperaturas del programa en °C (el motor trabaja en K por dentro).

